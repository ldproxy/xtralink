name: xtralink

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # checkout, and the release on a version tag
    services:
      # The lib/jobs Redis tests skip without a reachable Redis; redis:8
      # ships the JSON module RedisBackend needs.
      redis:
        image: redis:8
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 10
    steps:
      - name: clone
        uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"
          cache-dependency-path: ./go.sum
      - name: check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::not gofmt-formatted (run gofmt -w):"
            echo "$unformatted"
            exit 1
          fi
          go vet ./...
      - name: test
        run: go test -race -skip TestPkgPush ./...
      - name: build
        env:
          GIT_BRANCH: ${{ github.ref_name }}
          GIT_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          LDFLAGS="-s -w -X main.gitTag=${GIT_TAG} -X main.gitSha=${GITHUB_SHA::7} -X main.gitBranch=${GIT_BRANCH}"
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -o dist/linux-amd64/xtralink -ldflags="$LDFLAGS"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -o dist/linux-arm64/xtralink -ldflags="$LDFLAGS"
          CGO_ENABLED=0 GOOS=darwin GOARCH=arm64 go build -o dist/darwin-arm64/xtralink -ldflags="$LDFLAGS"
          cp Dockerfile dist/
          ls -lR ./dist
      - name: save
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist
          retention-days: 1
      - name: release-github
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        working-directory: ./dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          chmod +x ./*/xtralink
          tar -czvf xtralink_${{ github.ref_name }}_linux_amd64.tar.gz -C ./linux-amd64 xtralink
          tar -czvf xtralink_${{ github.ref_name }}_linux_arm64.tar.gz -C ./linux-arm64 xtralink
          tar -czvf xtralink_${{ github.ref_name }}_macos_arm64.tar.gz -C ./darwin-arm64 xtralink
          gh release create ${{ github.ref_name }} --title ${{ github.ref_name }} --draft
          gh release upload ${{ github.ref_name }} xtralink_${{ github.ref_name }}_linux_amd64.tar.gz
          gh release upload ${{ github.ref_name }} xtralink_${{ github.ref_name }}_linux_arm64.tar.gz
          gh release upload ${{ github.ref_name }} xtralink_${{ github.ref_name }}_macos_arm64.tar.gz

  docker:
    if: false
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: load
        uses: actions/download-artifact@v4
        with:
          name: dist
      - name: log0
        run: |
          ls -lR
      - name: chmod
        run: |
          chmod +x ./*/xtralink
      - name: log1
        run: |
          ls -lR
      - name: versions
        id: version
        run: |
          echo "sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - name: login
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.ghcr_rw_token }}
      - name: buildx
        uses: docker/setup-buildx-action@v3
      - name: push
        if: ${{ github.ref_type == 'branch' && github.ref_name == 'main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ghcr.io/ldproxy/xtralink:next
            ghcr.io/ldproxy/xtralink:next-${{steps.version.outputs.sha}}
          platforms: |
            linux/amd64
            linux/arm64
      - name: push-branch
        if: ${{ github.ref_type == 'branch' && github.ref_name != 'main' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ghcr.io/ldproxy/xtralink:${{ github.ref_name }}
            ghcr.io/ldproxy/xtralink:${{ github.ref_name }}-${{steps.version.outputs.sha}}
          platforms: |
            linux/amd64
            linux/arm64
      - name: tag
        if: ${{ github.ref_type == 'tag' && startsWith(github.ref_name, 'v') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true
          tags: |
            ghcr.io/ldproxy/xtralink:${{ steps.version.outputs.tag }}
            ghcr.io/ldproxy/xtralink:latest
          platforms: |
            linux/amd64
            linux/arm64
